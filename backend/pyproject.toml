[project]
name = "backend"
version = "0.1.0"
description = "Self-hosted YouTube Music jam: shared queue, one speaker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.12.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
